name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - 'web/**'
      - 'core/**'
      - 'assets/foods.sqlite'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen xcbeautify
      - run: ios/scripts/test.sh "iPhone 17" build/results.xcresult
      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screens
          path: |
            /tmp/bitey-shots
            /tmp/bitey-tour
            /tmp/bitey-widget
          if-no-files-found: ignore
          retention-days: 7
