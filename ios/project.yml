name: Bitey
options:
  bundleIdPrefix: com.zandaulion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Bitey
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Bitey:
    type: application
    platform: iOS
    sources:
      - path: Bitey
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zandaulion.bitey
    postCompileScripts:
      # web/ and core/ stay the single source of truth, as on Android: they are
      # copied into the app at build time and never edited here.
      - name: Copy the shared interface
        basedOnDependencyAnalysis: false
        script: |
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/www"
          root="$SRCROOT/.."
          rm -rf "$out"
          mkdir -p "$out/core" "$out/database"
          cp -R "$root/web/." "$out/"
          cp -R "$root/core/." "$out/core/"
          cp "$root/assets/foods.sqlite" "$out/database/foods.sqlite"
