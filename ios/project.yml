name: Bitey
options:
  bundleIdPrefix: com.zandaulion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Bitey
    # Only standard HTTPS, so uploads need not ask about encryption.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_NSCameraUsageDescription: Bitey uses the camera to photograph your meals and scan food barcodes.
    TARGETED_DEVICE_FAMILY: "1"
schemes:
  Bitey:
    build:
      targets:
        Bitey: all
    test:
      config: Debug
      targets:
        - BiteyUITests
targets:
  BiteyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BiteyWidget
        excludes:
          - Info.plist
          - BiteyWidget.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zandaulion.bitey.widget
        INFOPLIST_FILE: BiteyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: BiteyWidget/BiteyWidget.entitlements
  BiteyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BiteyUITests
    dependencies:
      - target: Bitey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zandaulion.bitey.uitests
  Bitey:
    type: application
    platform: iOS
    sources:
      - path: Bitey
        excludes:
          - Info.plist
          - Bitey.entitlements
      - path: Shared
    dependencies:
      - sdk: libsqlite3.tbd
      - target: BiteyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zandaulion.bitey
        INFOPLIST_FILE: Bitey/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bitey/Bitey.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postCompileScripts:
      # web/ and core/ stay the single source of truth, as on Android: they are
      # copied into the app at build time and never edited here.
      - name: Copy the shared interface
        basedOnDependencyAnalysis: false
        script: |
          out="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/www"
          root="$SRCROOT/.."
          rm -rf "$out"
          mkdir -p "$out/core" "$out/database"
          cp -R "$root/web/." "$out/"
          cp -R "$root/core/." "$out/core/"
          cp "$root/assets/foods.sqlite" "$out/database/foods.sqlite"
